name: Deploy to Google Apps Script

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: main
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install clasp globally
        run: npm install -g @google/clasp

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Decrypt clasp credentials
        run: |
          gpg \
            --quiet --batch --yes \
            --decrypt --passphrase="${{ secrets.CLASP_SECRET }}" \
            --output $HOME/.clasprc.json .clasprc.json.gpg
          chmod 600 $HOME/.clasprc.json

      - name: Deploy to multiple Apps Script projects
        run: |
          chmod +x ./prepare.sh
          
          # Split comma-separated script IDs into array
          IFS=',' read -ra SCRIPT_IDS <<< "${{ vars.CLASP_SCRIPT_IDS }}"
          
          # Deploy to each script ID
          for SCRIPT_ID in "${SCRIPT_IDS[@]}"; do
            # Trim whitespace
            SCRIPT_ID=$(echo "$SCRIPT_ID" | xargs)
            
            echo "Deploying to script ID: $SCRIPT_ID"
            
            # Setup clasp configuration for this script
            ./prepare.sh "$SCRIPT_ID"
            
            # Deploy
            npx clasp push -f
            
            echo "Successfully deployed to $SCRIPT_ID"
            echo "---"
          done

      - name: Cleanup
        if: always()
        run: rm -f $HOME/.clasprc.json